name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Colors follow the portfolio palette (navy waves)
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#2f4a78&color_dots=#ebedf0,#c6d4ea,#7a9cc6,#5b7db1,#2f4a78
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7a9cc6&color_dots=#161b22,#1a2237,#2f4a78,#5b7db1,#7a9cc6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
