name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # One dark version for every theme: the other cards are dark too (navy palette)
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7a9cc6&color_dots=#161b22,#1a2237,#2f4a78,#5b7db1,#7a9cc6

      # The snk action runs in Docker as root, so dist/ is not writable by the runner user
      - run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          node .github/scripts/snake-bg.mjs dist/github-snake-dark.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
