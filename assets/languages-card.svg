<svg xmlns="http://www.w3.org/2000/svg" width="300" height="195" viewBox="0 0 300 195" role="img" aria-label="Most used languages: Python, C, Java, SQL, TypeScript, JavaScript, C++, VHDL">
  <defs><clipPath id="bar"><rect x="25" y="55" width="250" height="8" rx="4"/></clipPath></defs>
  <style>
    .title { font: 600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #7a9cc6; }
    .name { font: 400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #c9d1d9; }
    .item { animation: in .4s ease-out both; }
    .grow { animation: grow .9s cubic-bezier(.2,.7,.2,1) both; transform-origin: 25px 0; }
    @keyframes in { from { opacity: 0 } to { opacity: 1 } }
    @keyframes grow { from { transform: scaleX(0) } to { transform: none } }
    @media (prefers-reduced-motion: reduce) { .item, .grow { animation: none } }
  </style>
  <rect width="300" height="195" rx="12" fill="#070a11"/>
  <text x="25" y="35" class="title">Most Used Languages</text>
  <g clip-path="url(#bar)"><g class="grow"><rect x="25.00" y="55" width="75.00" height="8" fill="#3572A5"><title>Python</title></rect><rect x="100.00" y="55" width="50.00" height="8" fill="#555555"><title>C</title></rect><rect x="150.00" y="55" width="37.50" height="8" fill="#b07219"><title>Java</title></rect><rect x="187.50" y="55" width="30.00" height="8" fill="#e38c00"><title>SQL</title></rect><rect x="217.50" y="55" width="20.00" height="8" fill="#3178c6"><title>TypeScript</title></rect><rect x="237.50" y="55" width="15.00" height="8" fill="#f1e05a"><title>JavaScript</title></rect><rect x="252.50" y="55" width="12.50" height="8" fill="#f34b7d"><title>C++</title></rect><rect x="265.00" y="55" width="10.00" height="8" fill="#adb2cb"><title>VHDL</title></rect></g></g>
  <g class="item" style="animation-delay:0.20s"><circle cx="30" cy="84" r="5" fill="#3572A5"/><text x="42" y="88" class="name">Python</text></g>
  <g class="item" style="animation-delay:0.28s"><circle cx="160" cy="84" r="5" fill="#555555"/><text x="172" y="88" class="name">C</text></g>
  <g class="item" style="animation-delay:0.36s"><circle cx="30" cy="109" r="5" fill="#b07219"/><text x="42" y="113" class="name">Java</text></g>
  <g class="item" style="animation-delay:0.44s"><circle cx="160" cy="109" r="5" fill="#e38c00"/><text x="172" y="113" class="name">SQL</text></g>
  <g class="item" style="animation-delay:0.52s"><circle cx="30" cy="134" r="5" fill="#3178c6"/><text x="42" y="138" class="name">TypeScript</text></g>
  <g class="item" style="animation-delay:0.60s"><circle cx="160" cy="134" r="5" fill="#f1e05a"/><text x="172" y="138" class="name">JavaScript</text></g>
  <g class="item" style="animation-delay:0.68s"><circle cx="30" cy="159" r="5" fill="#f34b7d"/><text x="42" y="163" class="name">C++</text></g>
  <g class="item" style="animation-delay:0.76s"><circle cx="160" cy="159" r="5" fill="#adb2cb"/><text x="172" y="163" class="name">VHDL</text></g>
</svg>
