<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Lucas Kamikawa, Computer Engineering at Insper">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10151f"/><stop offset="0.4" stop-color="#0d1219"/><stop offset="0.7" stop-color="#090d15"/><stop offset="1" stop-color="#070a11"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#e5e7eb"/><stop offset="1" stop-color="#7d8696"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="18"/></clipPath>
    <clipPath id="logo"><circle cx="600" cy="98" r="30"/></clipPath>
  </defs>
  <style>
    .name { font: 800 64px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: -1.5px; text-anchor: middle; }
    .sub { font: 400 21px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #a3a3a3; text-anchor: middle; }
    .chip { font: 600 15px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #c9d1d9; text-anchor: middle; letter-spacing: .4px; }
    .fade { animation: up .9s cubic-bezier(.2,.7,.2,1) both; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .6s }
    .d4 { animation-delay: .85s } .d5 { animation-delay: 1s } .d6 { animation-delay: 1.15s } .d7 { animation-delay: 1.3s }
    @keyframes up { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none } }
  </style>
  <g clip-path="url(#round)">
  <rect width="1200" height="320" fill="url(#bg)"/>
  <g transform="translate(0 320) scale(1 -1)"><g><g transform="translate(0 188) scale(0.8333333333333334 0.825)"><path d="M0,60 C480,140 960,0 1440,60 C1920,140 2400,0 2880,60 L2880,160 L0,160 Z" fill="rgba(18,25,42,0.92)"/></g><animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="36s" repeatCount="indefinite"/></g></g>
  <g transform="translate(0 320) scale(1 -1)"><g><g transform="translate(0 224) scale(0.8333333333333334 0.6)"><path d="M0,80 C360,10 1080,150 1440,80 C1800,10 2520,150 2880,80 L2880,160 L0,160 Z" fill="rgba(26,34,55,0.85)"/></g><animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="24s" repeatCount="indefinite"/></g></g>
  <g transform="translate(0 320) scale(1 -1)"><g><g transform="translate(0 252.8) scale(0.8333333333333334 0.42000000000000004)"><path d="M0,90 C240,20 720,160 1440,90 C1680,20 2160,160 2880,90 L2880,160 L0,160 Z" fill="rgba(34,46,72,0.78)"/></g><animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="16s" repeatCount="indefinite"/></g></g>
  </g>
  <g class="fade d1">
    <circle cx="600" cy="98" r="31.5" fill="none" stroke="rgba(255,255,255,0.15)"/>
    <image x="570" y="68" width="60" height="60" clip-path="url(#logo)" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
  </g>
  <text x="600" y="196" class="name fade d2" fill="url(#name)">Lucas Kamikawa</text>
  <text x="600" y="236" class="sub fade d3">Computer Engineering @ Insper  ·  São Paulo, Brazil</text>
  <g class="fade d4"><rect x="315" y="262" width="132" height="34" rx="17" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/><text x="381" y="284" class="chip">Cloud</text></g>
  <g class="fade d5"><rect x="461" y="262" width="132" height="34" rx="17" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/><text x="527" y="284" class="chip">Data</text></g>
  <g class="fade d6"><rect x="607" y="262" width="132" height="34" rx="17" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/><text x="673" y="284" class="chip">Cybersecurity</text></g>
  <g class="fade d7"><rect x="753" y="262" width="132" height="34" rx="17" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/><text x="819" y="284" class="chip">AI</text></g>
</svg>
