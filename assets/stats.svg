<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="20 projects, 12 certificates, 7 areas and an internship at Neria Energia">
<style>
.fade{animation:up .9s cubic-bezier(.2,.7,.2,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.4s}.d3{animation-delay:.65s}.d4{animation-delay:.9s}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10151f"/><stop offset="1" stop-color="#090d15"/></linearGradient></defs>
<rect width="1200" height="150" rx="14" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="1199" height="149" rx="14" fill="none" stroke="rgba(255,255,255,0.06)"/>
<g class="fade d1">
<rect x="40" y="48" width="4" height="46" fill="#e5e7eb"/>
<text x="68" y="96" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="56" fill="#e5e7eb">20</text>
<text x="146" y="80" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="18" letter-spacing="3" fill="#e5e7eb">PROJECTS</text>
<text x="146" y="102" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#7d8696">cloud, data and AI</text>
</g><g class="fade d2">
<rect x="326" y="48" width="4" height="46" fill="#e5e7eb"/>
<text x="354" y="96" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="56" fill="#e5e7eb">12</text>
<text x="432" y="80" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="18" letter-spacing="3" fill="#e5e7eb">CERTIFICATES</text>
<text x="432" y="102" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#7d8696">AWS and Google</text>
</g><g class="fade d3">
<rect x="612" y="48" width="4" height="46" fill="#e5e7eb"/>
<text x="640" y="96" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="56" fill="#e5e7eb">7</text>
<text x="684" y="80" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="18" letter-spacing="3" fill="#e5e7eb">AREAS</text>
<text x="684" y="102" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#7d8696">from LLMs to firmware</text>
</g><g class="fade d4">
<rect x="898" y="48" width="4" height="46" fill="#7a9cc6"/>
<text x="926" y="96" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="56" fill="#7a9cc6">1</text>
<text x="970" y="80" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="18" letter-spacing="3" fill="#e5e7eb">INTERNSHIP</text>
<text x="970" y="102" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#7d8696">Neria Energia</text>
</g>
</svg>